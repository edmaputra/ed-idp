<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editUserModal" class="modal-backdrop" onclick="if(event.target === this) document.getElementById('edit-user-modal').innerHTML = ''">
  <div class="modal-card">
    <div class="modal-header">
      <h3 style="font-size: 1.15rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
        <span>✏️</span> Edit User: <span th:text="${user.username}" style="color: var(--primary);">username</span>
      </h3>
      <button type="button" class="btn-close" onclick="document.getElementById('edit-user-modal').innerHTML = ''" aria-label="Close">&times;</button>
    </div>

    <form th:attr="hx-post=@{${basePath} + '/users/' + ${user.username}}"
          hx-target="#users-table"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('edit-user-modal').innerHTML = ''; showToast('User updated successfully', 'success'); }">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="modal-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Full Name</label>
            <input type="text" name="fullName" th:value="${user.fullName}" required
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Email</label>
            <input type="email" name="email" th:value="${user.email}" required
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Department</label>
            <input type="text" name="department" th:value="${user.department}"
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Tenant</label>
            <input type="text" name="tenantId" th:value="${user.tenantId}" required
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;">
            <input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}">
            <span>Account Active (Enabled)</span>
          </label>
        </div>

        <!-- Assign Roles Section -->
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
            🛡️ Assign Roles
          </label>
          <div style="max-height: 140px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
            <div th:if="${#lists.isEmpty(availableRoles)}" style="color: var(--text-muted); font-size: 0.8rem; padding: 0.25rem;">
              No custom roles configured. Standard roles default to ROLE_USER.
            </div>
            <div th:each="r : ${availableRoles}" style="margin-bottom: 0.35rem; font-size: 0.825rem;">
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                <input type="checkbox" name="roles" th:value="${r.name}"
                       th:checked="${#lists.contains(user.roles, r.name)}">
                <span style="font-weight: 600;" th:text="${r.name}">ROLE_USER</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" th:if="${r.description != null and !#strings.isEmpty(r.description)}" th:text="' - ' + ${r.description}"></span>
              </label>
            </div>
          </div>
        </div>

        <!-- Assign Groups Section -->
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
            👥 Assign Groups
          </label>
          <div style="max-height: 140px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
            <div th:if="${#lists.isEmpty(availableGroups)}" style="color: var(--text-muted); font-size: 0.8rem; padding: 0.25rem;">
              No groups defined. Create groups in Roles &amp; Groups tab.
            </div>
            <div th:each="g : ${availableGroups}" style="margin-bottom: 0.35rem; font-size: 0.825rem;">
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                <input type="checkbox" name="groups" th:value="${g.name}"
                       th:checked="${#lists.contains(user.groups, g.name)}">
                <span style="font-weight: 600;" th:text="${g.name}">Engineering</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" th:if="${g.description != null and !#strings.isEmpty(g.description)}" th:text="' - ' + ${g.description}"></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('edit-user-modal').innerHTML = ''">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <span>💾</span> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
