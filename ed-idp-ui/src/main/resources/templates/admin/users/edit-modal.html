<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editUserModal" class="modal-backdrop-custom" onclick="if(event.target === this) document.getElementById('edit-user-modal').innerHTML = ''">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-custom">
    <div class="modal-content shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="modal-header px-4 py-3 border-bottom bg-body-tertiary">
        <div class="d-flex align-items-center gap-2">
          <div class="p-2 bg-primary-subtle text-primary rounded-3">
            <i class="bi bi-pencil-square fs-5"></i>
          </div>
          <h5 class="modal-title fw-bold mb-0">
            Edit User: <span class="text-primary font-monospace" th:text="${user.username}">username</span>
          </h5>
        </div>
        <button type="button" class="btn-close" onclick="document.getElementById('edit-user-modal').innerHTML = ''" aria-label="Close"></button>
      </div>

      <form th:attr="hx-post=@{${basePath} + '/users/' + ${user.username}}"
            hx-target="#users-table"
            hx-swap="outerHTML"
            hx-on::after-request="if(event.detail.successful) { document.getElementById('edit-user-modal').innerHTML = ''; showToast('User updated successfully', 'success'); }">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="modal-body p-4">
          <!-- Full Name & Email Row -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="fullName" th:value="${user.fullName}" required class="form-control">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Email <span class="text-danger">*</span></label>
              <input type="email" name="email" th:value="${user.email}" required class="form-control">
            </div>
          </div>

          <!-- Department & Tenant Row -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Department</label>
              <input type="text" name="department" th:value="${user.department}" placeholder="Engineering, Security, etc." class="form-control">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Tenant <span class="text-danger">*</span></label>
              <input type="text" name="tenantId" th:value="${user.tenantId}" required class="form-control font-monospace">
            </div>
          </div>

          <!-- Active Status Switch -->
          <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" role="switch" id="userActiveSwitch" name="enabled" value="true" th:checked="${user.enabled}">
            <label class="form-check-label fw-semibold small" for="userActiveSwitch">Account Active (Credentials enabled for login)</label>
          </div>

          <!-- Roles Assignment -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary d-flex align-items-center gap-1 mb-2">
              <i class="bi bi-shield-shaded text-primary"></i>
              <span>Assign Roles</span>
            </label>
            <div class="card border bg-body-tertiary rounded-3 p-3" style="max-height: 150px; overflow-y: auto;">
              <div th:if="${#lists.isEmpty(availableRoles)}" class="text-secondary small">
                No custom roles configured. Default roles will apply.
              </div>
              <div th:each="r : ${availableRoles}" class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="roles" th:value="${r.name}" th:id="'role-chk-' + ${r.name}"
                       th:checked="${#lists.contains(user.roles, r.name)}">
                <label class="form-check-label small" th:for="'role-chk-' + ${r.name}">
                  <span class="fw-semibold text-body-emphasis" th:text="${r.name}">ROLE_USER</span>
                  <span class="text-secondary ms-1" th:if="${r.description != null and !#strings.isEmpty(r.description)}" th:text="'— ' + ${r.description}"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- Groups Assignment -->
          <div>
            <label class="form-label small fw-semibold text-secondary d-flex align-items-center gap-1 mb-2">
              <i class="bi bi-collection-fill text-info"></i>
              <span>Assign Groups</span>
            </label>
            <div class="card border bg-body-tertiary rounded-3 p-3" style="max-height: 150px; overflow-y: auto;">
              <div th:if="${#lists.isEmpty(availableGroups)}" class="text-secondary small">
                No groups defined in directory. Create groups in Roles &amp; Groups tab.
              </div>
              <div th:each="g : ${availableGroups}" class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="groups" th:value="${g.name}" th:id="'grp-chk-' + ${g.name}"
                       th:checked="${#lists.contains(user.groups, g.name)}">
                <label class="form-check-label small" th:for="'grp-chk-' + ${g.name}">
                  <span class="fw-semibold text-body-emphasis" th:text="${g.name}">Engineering</span>
                  <span class="text-secondary ms-1" th:if="${g.description != null and !#strings.isEmpty(g.description)}" th:text="'— ' + ${g.description}"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer px-4 py-3 bg-body-tertiary border-top d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" onclick="document.getElementById('edit-user-modal').innerHTML = ''">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium d-inline-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-floppy"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
