<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editRoleModal" class="modal-backdrop-custom" onclick="if(event.target === this) document.getElementById('rbac-modal').innerHTML = ''">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-custom">
    <div class="modal-content shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="modal-header px-4 py-3 border-bottom bg-body-tertiary">
        <div class="d-flex align-items-center gap-2">
          <div class="p-2 bg-warning-subtle text-warning rounded-3">
            <i class="bi bi-pencil-square fs-5"></i>
          </div>
          <h5 class="modal-title fw-bold mb-0">
            Edit Role: <span class="text-warning font-monospace" th:text="${role.name}">ROLE_USER</span>
          </h5>
        </div>
        <button type="button" class="btn-close" onclick="document.getElementById('rbac-modal').innerHTML = ''" aria-label="Close"></button>
      </div>

      <form th:attr="hx-post=@{${basePath} + '/rbac/roles/' + ${role.id}}"
            hx-target="#roles-table"
            hx-swap="outerHTML"
            hx-on::after-request="if(event.detail.successful) { document.getElementById('rbac-modal').innerHTML = ''; showToast('Role updated successfully', 'success'); }">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="modal-body p-4">
          <!-- Role Name & Tenant Row -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Role Name</label>
              <input type="text" th:value="${role.name}" disabled class="form-control font-monospace bg-body-secondary text-secondary">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Tenant</label>
              <input type="text" th:value="${role.tenantId}" disabled class="form-control font-monospace bg-body-secondary text-secondary">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Description</label>
            <input type="text" name="description" th:value="${role.description}" placeholder="Description of role purpose" class="form-control">
          </div>

          <!-- Granted Permissions -->
          <div>
            <label class="form-label small fw-semibold text-secondary d-flex align-items-center gap-1 mb-2">
              <i class="bi bi-key-fill text-primary"></i>
              <span>Granted Permissions</span>
            </label>
            <div class="card border bg-body-tertiary rounded-3 p-3" style="max-height: 200px; overflow-y: auto;">
              <div th:if="${#lists.isEmpty(availablePermissions)}" class="text-secondary small">
                No permissions available in catalog.
              </div>
              <div th:each="perm : ${availablePermissions}" class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="permissions" th:value="${perm.id}" th:id="'edit-perm-' + ${perm.id}"
                       th:checked="${#lists.contains(role.permissionIds, perm.id)}">
                <label class="form-check-label small" th:for="'edit-perm-' + ${perm.id}">
                  <span class="font-monospace fw-semibold text-primary" th:text="${perm.code}">clients:read</span>
                  <span class="text-secondary ms-1" th:text="'— ' + ${perm.name}">— View Clients</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer px-4 py-3 bg-body-tertiary border-top d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" onclick="document.getElementById('rbac-modal').innerHTML = ''">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium d-inline-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-floppy"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
