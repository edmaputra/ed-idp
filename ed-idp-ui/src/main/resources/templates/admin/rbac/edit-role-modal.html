<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editRoleModal" class="modal-backdrop" onclick="if(event.target === this) document.getElementById('rbac-modal').innerHTML = ''">
  <div class="modal-card">
    <div class="modal-header">
      <h3 style="font-size: 1.15rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
        <span>✏️</span> Edit Role: <span th:text="${role.name}" style="color: var(--primary);">ROLE_USER</span>
      </h3>
      <button type="button" class="btn-close" onclick="document.getElementById('rbac-modal').innerHTML = ''" aria-label="Close">&times;</button>
    </div>

    <form th:attr="hx-post=@{${basePath} + '/rbac/roles/' + ${role.id}}"
          hx-target="#roles-table"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('rbac-modal').innerHTML = ''; showToast('Role updated successfully', 'success'); }">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="modal-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Role Name</label>
            <input type="text" th:value="${role.name}" disabled
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: #f1f5f9; color: var(--text-muted);">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Tenant</label>
            <input type="text" th:value="${role.tenantId}" disabled
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: #f1f5f9; color: var(--text-muted);">
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Description</label>
          <input type="text" name="description" th:value="${role.description}" placeholder="Description of role purpose"
                 style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
            🛡️ Granted Permissions
          </label>
          <div style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
            <div th:if="${#lists.isEmpty(availablePermissions)}" style="color: var(--text-muted); font-size: 0.8rem; padding: 0.25rem;">
              No permissions available in catalog.
            </div>
            <div th:each="perm : ${availablePermissions}" style="margin-bottom: 0.35rem; font-size: 0.825rem;">
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                <input type="checkbox" name="permissions" th:value="${perm.id}"
                       th:checked="${#lists.contains(role.permissionIds, perm.id)}">
                <span style="font-weight: 600; font-family: monospace; font-size: 0.8rem; color: var(--primary);" th:text="${perm.code}">clients:read</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" th:text="'— ' + ${perm.name}">— View Clients</span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('rbac-modal').innerHTML = ''">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <span>💾</span> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
