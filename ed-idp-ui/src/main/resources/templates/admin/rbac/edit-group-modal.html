<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editGroupModal" class="modal-backdrop" onclick="if(event.target === this) document.getElementById('rbac-modal').innerHTML = ''">
  <div class="modal-card">
    <div class="modal-header">
      <h3 style="font-size: 1.15rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem;">
        <span>✏️</span> Edit Group: <span th:text="${group.name}" style="color: var(--primary);">Engineering</span>
      </h3>
      <button type="button" class="btn-close" onclick="document.getElementById('rbac-modal').innerHTML = ''" aria-label="Close">&times;</button>
    </div>

    <form th:attr="hx-post=@{${basePath} + '/rbac/groups/' + ${group.id}}"
          hx-target="#groups-table"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('rbac-modal').innerHTML = ''; showToast('Group updated successfully', 'success'); }">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="modal-body">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Group Name</label>
            <input type="text" th:value="${group.name}" disabled
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: #f1f5f9; color: var(--text-muted);">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Tenant</label>
            <input type="text" th:value="${group.tenantId}" disabled
                   style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: #f1f5f9; color: var(--text-muted);">
          </div>
        </div>

        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Description</label>
          <input type="text" name="description" th:value="${group.description}" placeholder="Description of group purpose"
                 style="width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;">
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
            👥 Mapped Roles
          </label>
          <div style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; background: #f8fafc;">
            <div th:if="${#lists.isEmpty(availableRoles)}" style="color: var(--text-muted); font-size: 0.8rem; padding: 0.25rem;">
              No roles configured.
            </div>
            <div th:each="r : ${availableRoles}" style="margin-bottom: 0.35rem; font-size: 0.825rem;">
              <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                <input type="checkbox" name="roleIds" th:value="${r.id}"
                       th:checked="${#lists.contains(group.roleIds, r.id)}">
                <span style="font-weight: 600;" th:text="${r.name}">ROLE_USER</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" th:if="${r.description != null and !#strings.isEmpty(r.description)}" th:text="' — ' + ${r.description}"></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('rbac-modal').innerHTML = ''">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <span>💾</span> Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
