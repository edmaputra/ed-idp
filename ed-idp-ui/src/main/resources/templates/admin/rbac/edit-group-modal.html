<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="editGroupModal" class="modal-backdrop-custom" onclick="if(event.target === this) document.getElementById('rbac-modal').innerHTML = ''">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-custom">
    <div class="modal-content shadow-lg border-0 rounded-4 overflow-hidden">
      <div class="modal-header px-4 py-3 border-bottom bg-body-tertiary">
        <div class="d-flex align-items-center gap-2">
          <div class="p-2 bg-danger-subtle text-danger rounded-3">
            <i class="bi bi-pencil-square fs-5"></i>
          </div>
          <h5 class="modal-title fw-bold mb-0">
            Edit Group: <span class="text-danger" th:text="${group.name}">Engineering</span>
          </h5>
        </div>
        <button type="button" class="btn-close" onclick="document.getElementById('rbac-modal').innerHTML = ''" aria-label="Close"></button>
      </div>

      <form th:attr="hx-post=@{${basePath} + '/rbac/groups/' + ${group.id}}"
            hx-target="#groups-table"
            hx-swap="outerHTML"
            hx-on::after-request="if(event.detail.successful) { document.getElementById('rbac-modal').innerHTML = ''; showToast('Group updated successfully', 'success'); }">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="modal-body p-4">
          <!-- Group Name & Tenant Row -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Group Name</label>
              <input type="text" th:value="${group.name}" disabled class="form-control bg-body-secondary text-secondary">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label small fw-semibold text-secondary">Tenant</label>
              <input type="text" th:value="${group.tenantId}" disabled class="form-control font-monospace bg-body-secondary text-secondary">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Description</label>
            <input type="text" name="description" th:value="${group.description}" placeholder="Description of group purpose" class="form-control">
          </div>

          <!-- Mapped Roles -->
          <div>
            <label class="form-label small fw-semibold text-secondary d-flex align-items-center gap-1 mb-2">
              <i class="bi bi-shield-shaded text-warning"></i>
              <span>Mapped Roles</span>
            </label>
            <div class="card border bg-body-tertiary rounded-3 p-3" style="max-height: 200px; overflow-y: auto;">
              <div th:if="${#lists.isEmpty(availableRoles)}" class="text-secondary small">
                No roles configured.
              </div>
              <div th:each="r : ${availableRoles}" class="form-check mb-2">
                <input class="form-check-input" type="checkbox" name="roleIds" th:value="${r.id}" th:id="'edit-grp-role-' + ${r.id}"
                       th:checked="${#lists.contains(group.roleIds, r.id)}">
                <label class="form-check-label small" th:for="'edit-grp-role-' + ${r.id}">
                  <span class="fw-semibold text-body-emphasis" th:text="${r.name}">ROLE_USER</span>
                  <span class="text-secondary ms-1" th:if="${r.description != null and !#strings.isEmpty(r.description)}" th:text="'— ' + ${r.description}"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer px-4 py-3 bg-body-tertiary border-top d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-4" onclick="document.getElementById('rbac-modal').innerHTML = ''">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium d-inline-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-floppy"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
