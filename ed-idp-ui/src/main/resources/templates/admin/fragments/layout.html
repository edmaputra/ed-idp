<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} + ' - ed-idp Admin'">ed-idp Admin</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Latest Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- ed-idp Custom Stylesheet -->
  <link rel="stylesheet" th:href="@{/ui-assets/css/admin.css}">

  <!-- Early Theme Init to avoid FOUC -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('edidp-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>

  <!-- HTMX & Bootstrap Bundle JS -->
  <script th:src="@{/ui-assets/js/htmx.min.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script th:src="@{/ui-assets/js/qrcode.min.js}"></script>
</head>
<body>

<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(activeMenu)" class="app-sidebar" id="app-sidebar">
  <div class="sidebar-header">
    <a th:href="@{${basePath} + '/dashboard'}" class="sidebar-brand">
      <div class="sidebar-brand-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div class="sidebar-brand-text">
        <span class="sidebar-brand-title">ed-idp</span>
        <span class="sidebar-brand-subtitle">Identity &amp; Access</span>
      </div>
    </a>
  </div>
  <div class="sidebar-body">
    <div class="sidebar-label">Navigation</div>
    <ul class="sidebar-nav">
      <li>
        <a th:href="@{${basePath} + '/dashboard'}" class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-label mt-3">Identity &amp; Federation</div>
    <ul class="sidebar-nav">
      <li>
        <a th:href="@{${basePath} + '/clients'}" class="nav-link" th:classappend="${activeMenu == 'clients'} ? ' active' : ''">
          <i class="bi bi-key-fill"></i>
          <span>OAuth2 Clients</span>
        </a>
      </li>
      <li>
        <a th:href="@{${basePath} + '/users'}" class="nav-link" th:classappend="${activeMenu == 'users'} ? ' active' : ''">
          <i class="bi bi-people-fill"></i>
          <span>Users &amp; IAM</span>
        </a>
      </li>
      <li>
        <a th:href="@{${basePath} + '/rbac'}" class="nav-link" th:classappend="${activeMenu == 'rbac'} ? ' active' : ''">
          <i class="bi bi-shield-shaded"></i>
          <span>Roles &amp; Groups</span>
        </a>
      </li>
      <li>
        <a th:href="@{${basePath} + '/tenants'}" class="nav-link" th:classappend="${activeMenu == 'tenants'} ? ' active' : ''">
          <i class="bi bi-buildings-fill"></i>
          <span>Tenants</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-label mt-3">Account &amp; Security</div>
    <ul class="sidebar-nav">
      <li>
        <a th:href="@{${basePath} + '/profile'}" class="nav-link" th:classappend="${activeMenu == 'profile'} ? ' active' : ''">
          <i class="bi bi-person-circle"></i>
          <span>My Profile</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-footer">
    <div class="d-flex align-items-center justify-content-between px-1">
      <span class="small text-secondary"><i class="bi bi-shield-check me-1 text-success"></i>v0.0.1</span>
      <span class="badge text-bg-secondary rounded-pill font-monospace" style="font-size: 0.65rem;">OAuth 2.1</span>
    </div>
    <form th:action="@{${basePath} + '/logout'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button type="submit" class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-right"></i>
        <span>Sign Out</span>
      </button>
    </form>
  </div>
</aside>

<!-- Topbar Fragment -->
<header th:fragment="topbar(pageTitle)" class="app-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" onclick="toggleMobileSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-list fs-5"></i>
    </button>
    <div>
      <h1 class="h5 mb-0 fw-bold" th:text="${pageTitle}">Page Title</h1>
      <span class="text-secondary small d-none d-md-inline">Console Management &bull; OAuth 2.1 &amp; OIDC Engine</span>
    </div>
  </div>

  <div class="d-flex align-items-center gap-2">
    <!-- User Profile Link -->
    <a th:href="@{${basePath} + '/profile'}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-1" title="My Profile &amp; Credentials">
      <i class="bi bi-person-fill"></i>
      <span class="small d-none d-sm-inline">Profile</span>
    </a>

    <!-- Dark/Light Theme Switcher -->
    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2"
            id="theme-toggle-btn"
            onclick="toggleTheme()"
            title="Toggle light/dark theme">
      <i class="bi bi-moon-stars-fill" id="theme-toggle-icon"></i>
      <span class="small d-none d-sm-inline" id="theme-toggle-text">Theme</span>
    </button>

    <!-- Admin Indicator -->
    <span class="badge text-bg-success rounded-pill px-3 py-2 d-flex align-items-center gap-1 shadow-sm">
      <i class="bi bi-shield-fill-check"></i>
      <span>Admin Console</span>
    </span>
  </div>
</header>

<!-- Global Toast Container Fragment -->
<div id="toast-container" th:fragment="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

<!-- Global Scripts Fragment -->
<script th:fragment="toastScript">
  // Theme Management
  function initTheme() {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    updateThemeUI(currentTheme);
  }

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    localStorage.setItem('edidp-theme', newTheme);
    updateThemeUI(newTheme);
  }

  function updateThemeUI(theme) {
    const icon = document.getElementById('theme-toggle-icon');
    const text = document.getElementById('theme-toggle-text');
    if (icon) {
      if (theme === 'dark') {
        icon.className = 'bi bi-sun-fill text-warning';
        if (text) text.textContent = 'Light';
      } else {
        icon.className = 'bi bi-moon-stars-fill';
        if (text) text.textContent = 'Dark';
      }
    }
  }

  // Mobile Sidebar Toggle
  function toggleMobileSidebar() {
    const sidebar = document.getElementById('app-sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    if (sidebar) sidebar.classList.toggle('show');
    if (backdrop) backdrop.classList.toggle('show');
  }

  // Bootstrap Toast Notifications
  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const bgClass = type === 'success' ? 'text-bg-success' : type === 'error' ? 'text-bg-danger' : 'text-bg-primary';
    const icon = type === 'success' ? 'bi-check-circle-fill' : type === 'error' ? 'bi-exclamation-octagon-fill' : 'bi-info-circle-fill';

    const toastEl = document.createElement('div');
    toastEl.className = `toast align-items-center ${bgClass} border-0 shadow-lg show toast-custom mb-2`;
    toastEl.setAttribute('role', 'alert');
    toastEl.setAttribute('aria-live', 'assertive');
    toastEl.setAttribute('aria-atomic', 'true');
    toastEl.innerHTML = `
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi ${icon} fs-5"></i>
          <span class="fw-medium">${message}</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close" onclick="this.closest('.toast').remove()"></button>
      </div>
    `;
    container.appendChild(toastEl);

    setTimeout(() => {
      toastEl.classList.remove('show');
      toastEl.classList.add('toast-hide');
      setTimeout(() => toastEl.remove(), 300);
    }, 3500);
  }

  document.addEventListener('showToast', function (e) {
    if (e.detail && e.detail.message) {
      showToast(e.detail.message, e.detail.type || 'success');
    }
  });

  document.addEventListener('htmx:responseError', function (e) {
    let msg = 'Operation failed: Server returned error';
    if (e.detail && e.detail.xhr) {
      if (e.detail.xhr.status === 403 || e.detail.xhr.status === 401) {
        msg = 'Unauthorized or session expired';
      } else if (e.detail.xhr.responseText && e.detail.xhr.responseText.length < 120 && !e.detail.xhr.responseText.includes('<html')) {
        msg = e.detail.xhr.responseText;
      } else if (e.detail.xhr.statusText) {
        msg = `Operation failed (${e.detail.xhr.status}: ${e.detail.xhr.statusText})`;
      }
    }
    showToast(msg, 'error');
  });

  document.addEventListener('htmx:sendError', function (e) {
    showToast('Network error: Request failed', 'error');
  });

  document.addEventListener('DOMContentLoaded', initTheme);
</script>

</body>
</html>
