<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ed-idp</title>
  <link rel="stylesheet" th:href="@{/ui-assets/css/admin.css}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f1f5f9;
      height: 100vh;
    }
    .login-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }
    .form-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .alert-error {
      background-color: var(--danger-bg);
      color: var(--danger-text);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem;">🛡️ ed-idp Admin</h1>
    <p style="color: var(--text-muted); font-size: 0.875rem;">Sign in to your administration console</p>
  </div>

  <div th:if="${param.error}" class="alert-error">
    Invalid username or password.
  </div>
  <div th:if="${param.logout}" class="alert-error" style="background-color: var(--success-bg); color: var(--success-text);">
    You have been logged out.
  </div>

  <form th:action="@{${basePath} + '/login'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input class="form-input" type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
  </form>
</div>

</body>
</html>
