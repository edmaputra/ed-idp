<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ed-idp</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Latest Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- ed-idp Custom Stylesheet -->
  <link rel="stylesheet" th:href="@{/ui-assets/css/admin.css}">

  <!-- Early Theme Init -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('edidp-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>
</head>
<body class="bg-body-tertiary min-vh-100 d-flex flex-column align-items-center justify-content-center p-3 position-relative">

<!-- Theme Switcher Top-Right -->
<div class="position-absolute top-0 end-0 p-3">
  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-flex align-items-center gap-2"
          id="theme-toggle-btn"
          onclick="toggleLoginTheme()"
          title="Toggle light/dark theme">
    <i class="bi bi-moon-stars-fill" id="theme-toggle-icon"></i>
    <span class="small d-none d-sm-inline" id="theme-toggle-text">Theme</span>
  </button>
</div>

<!-- Login Card -->
<div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 420px; overflow: hidden;">
  <!-- Card Header Banner -->
  <div class="bg-primary bg-gradient p-4 text-center text-white">
    <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle shadow-sm mb-3" style="width: 56px; height: 56px; font-size: 1.75rem;">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="h4 fw-bold mb-1">ed-idp Admin</h1>
    <p class="small text-white-50 mb-0">Identity &amp; Access Management Console</p>
  </div>

  <div class="card-body p-4 p-md-5">
    <!-- Alert Messages -->
    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small rounded-3 mb-4" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-5 flex-shrink-0"></i>
      <div>Invalid username or password. Please verify credentials.</div>
    </div>
    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 small rounded-3 mb-4" role="alert">
      <i class="bi bi-check-circle-fill fs-5 flex-shrink-0"></i>
      <div>You have been safely signed out.</div>
    </div>

    <!-- Login Form -->
    <form th:action="@{${basePath} + '/login'}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary" for="username">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-body text-secondary border-end-0">
            <i class="bi bi-person-fill"></i>
          </span>
          <input class="form-control border-start-0 ps-1" type="text" id="username" name="username" placeholder="Enter username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-body text-secondary border-end-0">
            <i class="bi bi-key-fill"></i>
          </span>
          <input class="form-control border-start-0 ps-1" type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow-sm d-flex align-items-center justify-content-center gap-2">
        <span>Sign In to Console</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>
  </div>

  <div class="card-footer bg-body-tertiary text-center py-3 border-top small text-secondary">
    <i class="bi bi-lock-fill me-1 text-primary"></i>Protected by <strong>ed-idp</strong> Multi-Tenant Security
  </div>
</div>

<script>
  function toggleLoginTheme() {
    const currentTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-bs-theme', newTheme);
    localStorage.setItem('edidp-theme', newTheme);
    updateLoginThemeUI(newTheme);
  }

  function updateLoginThemeUI(theme) {
    const icon = document.getElementById('theme-toggle-icon');
    const text = document.getElementById('theme-toggle-text');
    if (icon) {
      if (theme === 'dark') {
        icon.className = 'bi bi-sun-fill text-warning';
        if (text) text.textContent = 'Light';
      } else {
        icon.className = 'bi bi-moon-stars-fill';
        if (text) text.textContent = 'Dark';
      }
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const theme = document.documentElement.getAttribute('data-bs-theme') || 'light';
    updateLoginThemeUI(theme);
  });
</script>

</body>
</html>
