<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signed Out — ed-idp Account Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: var(--bs-body-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logout-card {
      max-width: 440px;
      width: 100%;
      border: 1px solid var(--bs-border-color-translucent);
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>

  <div class="card logout-card p-4 p-sm-5 text-center">
    <div class="mb-3 text-primary">
      <i class="bi bi-shield-check" style="font-size: 3.5rem;"></i>
    </div>
    <h3 class="fw-bold mb-2">Signed Out</h3>
    <p class="text-secondary small mb-4">
      You have been successfully signed out of the <strong>ed-idp Account Portal</strong>.
    </p>

    <div class="d-grid gap-2">
      <a href="/account" class="btn btn-primary d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i>
        <span>Sign In Again</span>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
