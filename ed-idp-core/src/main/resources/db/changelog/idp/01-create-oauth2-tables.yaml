databaseChangeLog:
  - changeSet:
      id: 2026101201-create-oauth2-authorization-server-tables
      author: edmaputra
      changes:
        - createTable:
            tableName: oauth2_registered_client
            columns:
              - column:
                  name: id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: client_id_issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: VARCHAR(200)
              - column:
                  name: client_secret_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: client_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: client_authentication_methods
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_types
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: redirect_uris
                  type: VARCHAR(1000)
              - column:
                  name: post_logout_redirect_uris
                  type: VARCHAR(1000)
              - column:
                  name: scopes
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: client_settings
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: token_settings
                  type: VARCHAR(2000)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(100)
                  defaultValue: demo
                  constraints:
                    nullable: false
        - createIndex:
            tableName: oauth2_registered_client
            indexName: ix_oauth2_registered_client_tenant
            columns:
              - column:
                  name: tenant_id
        - addUniqueConstraint:
            tableName: oauth2_registered_client
            columnNames: tenant_id, client_id
            constraintName: ux_oauth2_registered_client_tenant_client
        - createTable:
            tableName: oauth2_authorization
            columns:
              - column:
                  name: id
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: registered_client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: principal_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: authorized_scopes
                  type: VARCHAR(1000)
              - column:
                  name: attributes
                  type: BLOB
              - column:
                  name: state
                  type: VARCHAR(500)
              - column:
                  name: authorization_code_value
                  type: BLOB
              - column:
                  name: authorization_code_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: authorization_code_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: authorization_code_metadata
                  type: BLOB
              - column:
                  name: access_token_value
                  type: BLOB
              - column:
                  name: access_token_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: access_token_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: access_token_metadata
                  type: BLOB
              - column:
                  name: access_token_type
                  type: VARCHAR(100)
              - column:
                  name: access_token_scopes
                  type: VARCHAR(1000)
              - column:
                  name: oidc_id_token_value
                  type: BLOB
              - column:
                  name: oidc_id_token_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: oidc_id_token_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: oidc_id_token_metadata
                  type: BLOB
              - column:
                  name: refresh_token_value
                  type: BLOB
              - column:
                  name: refresh_token_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: refresh_token_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: refresh_token_metadata
                  type: BLOB
              - column:
                  name: user_code_value
                  type: BLOB
              - column:
                  name: user_code_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: user_code_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: user_code_metadata
                  type: BLOB
              - column:
                  name: device_code_value
                  type: BLOB
              - column:
                  name: device_code_issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: device_code_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: device_code_metadata
                  type: BLOB
              - column:
                  name: tenant_id
                  type: VARCHAR(100)
                  defaultValue: demo
                  constraints:
                    nullable: false
        - createIndex:
            tableName: oauth2_authorization
            indexName: ix_oauth2_authorization_tenant
            columns:
              - column:
                  name: tenant_id
        - createTable:
            tableName: oauth2_authorization_consent
            columns:
              - column:
                  name: registered_client_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: principal_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: authorities
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(100)
                  defaultValue: demo
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: oauth2_authorization_consent
            columnNames: registered_client_id, principal_name
            constraintName: pk_oauth2_authorization_consent
        - createIndex:
            tableName: oauth2_authorization_consent
            indexName: ix_oauth2_authorization_consent_tenant
            columns:
              - column:
                  name: tenant_id
